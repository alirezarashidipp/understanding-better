[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mrm-model-review"
version = "0.3.0"
description = "Local FastAPI MVP for MRM use-case understanding and metric review."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
mrm-review = "cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "ai_reviewer",
    "api",
    "cli",
    "config",
    "input_reader",
    "openai_connection",
    "output_writer",
    "prompt_loader",
    "schemas",
    "workflow",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
